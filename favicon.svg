<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#001433"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#DA291C"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- iOS-style Squircle Rounded Card -->
  <rect width="512" height="512" rx="120" fill="url(#bueBg)"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Academic Shield / Crest Outline -->
  <g filter="url(#glow)">
    <!-- Crimson Ribbon Accent on Top -->
    <path d="M196 90 L316 90 L336 120 L176 120 Z" fill="url(#redAccent)" rx="4"/>
    <circle cx="256" cy="105" r="7" fill="#FFFFFF"/>

    <!-- Open Book Crest Graphic -->
    <g transform="translate(156, 140)">
      <!-- Left Page -->
      <path d="M100 85 C60 70, 20 75, 0 85 L0 25 C20 15, 60 10, 100 25 Z" fill="#FFFFFF" opacity="0.95"/>
      <!-- Right Page -->
      <path d="M100 85 C140 70, 180 75, 200 85 L200 25 C180 15, 140 10, 100 25 Z" fill="#FFFFFF" opacity="0.95"/>
      <!-- Book Spine / Center Line -->
      <line x1="100" y1="20" x2="100" y2="88" stroke="#002D62" stroke-width="6" stroke-linecap="round"/>
      <!-- Page Lines Left -->
      <line x1="25" y1="42" x2="80" y2="38" stroke="#002D62" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="25" y1="58" x2="80" y2="54" stroke="#002D62" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <!-- Page Lines Right -->
      <line x1="120" y1="38" x2="175" y2="42" stroke="#002D62" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="120" y1="54" x2="175" y2="58" stroke="#002D62" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- BUE Bold Typographic Monogram -->
    <text x="256" y="325" 
          font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="108" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#FFFFFF" 
          text-anchor="middle">BUE</text>

    <!-- Subtitle: BOOKING -->
    <text x="256" y="375" 
          font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="10" 
          fill="url(#goldAccent)" 
          text-anchor="middle">SPACES</text>

    <!-- Decorative Red Dot Divider -->
    <circle cx="256" cy="420" r="6" fill="url(#redAccent)"/>
    <line x1="180" y1="420" x2="236" y2="420" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="276" y1="420" x2="332" y2="420" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>